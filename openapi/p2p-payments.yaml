  /transfers:
    get:
      description: Retrieve the user's P2P payment history including sent and received
        transfers.
      operationId: listP2pTransfers
      parameters:
      - description: Page number for pagination
        in: query
        name: page
        schema:
          default: 1
          minimum: 1.0
          type: integer
      - description: Number of results per page (max 100)
        in: query
        name: per_page
        schema:
          default: 20
          maximum: 100.0
          minimum: 1.0
          type: integer
      - description: Field to sort results by
        in: query
        name: sort_by
        schema:
          type: string
      - description: Sort direction
        in: query
        name: sort_order
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
      - description: Filter by sent or received
        in: query
        name: direction
        schema:
          enum:
          - sent
          - received
          type: string
      - description: Filter by status
        in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - amount: 1500
                  currency: USD
                  delivery_speed: standard
                  memo: "Dinner last night \U0001F355"
                  recipient_id: string
                  sender_id: string
                  status: pending
                  transfer_id: string
                pagination:
                  page: 1
                  per_page: 20
                  total_items: 142
                  total_pages: 8
              schema:
                properties:
                  data:
                    items:
                      properties:
                        amount:
                          description: Transaction amount
                          example: 1500
                          format: double
                          type: number
                        currency:
                          description: ISO 4217 currency code
                          example: USD
                          maxLength: 3
                          minLength: 3
                          type: string
                        delivery_speed:
                          description: Standard (next-day ACH) or instant (RTP/debit
                            push)
                          enum:
                          - standard
                          - instant
                          type: string
                        memo:
                          description: Payment note visible to both parties
                          example: "Dinner last night \U0001F355"
