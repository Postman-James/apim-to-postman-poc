  /requests/{request_id}/pay:
    post:
      description: Fulfill an incoming payment request. Debits the specified funding
        source and credits the requester.
      operationId: payRequest
      parameters:
      - description: Unique request id
        in: path
        name: request_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              delivery_speed: standard
              funding_source_id: string
            schema:
              properties:
                delivery_speed:
                  description: Standard (next-day ACH) or instant (RTP/debit push)
                  enum:
                  - standard
                  - instant
                  type: string
                funding_source_id:
                  description: Source account or card
                  type: string
              required:
              - funding_source_id
              type: object
        description: Pay payment request request payload
      responses:
        '201':
          content:
            application/json:
              example:
                request_id: string
                status: completed
                transfer_id: string
              schema:
                properties:
                  request_id:
                    format: uuid
                    type: string
                  status:
                    example: completed
                    type: string
                  transfer_id:
                    description: P2P transfer identifier
                    format: uuid
                    type: string
                required:
                - request_id
                type: object
          description: Successful response
        '400':
