$kind: collection
name: Peer-to-Peer Payments API - Smoke Tests
description: "Smoke gate generated from the real APIM export. Checks every P2P endpoint is up: 2xx status and fast response."
variables:
  baseUrl: https://api.bankofpostman.com/p2p-payments
scripts:
  - type: http:afterResponse
    code: |-
      pm.test('Smoke: 2xx status', function(){ pm.expect([200,201,202,204]).to.include(pm.response.code); });
      pm.test('Smoke: responds under 3000ms', function(){ pm.expect(pm.response.responseTime).to.be.below(3000); });
    language: text/javascript
