$kind: collection
description: |-
  Consumer peer-to-peer money transfer service with instant and standard delivery options. Send and request money by user ID, email, or phone number with real-time notifications, customizable payment memos, and tiered transfer limits based on identity verification level.

  Contact Support:
   Name: Acme Finance API Team
   Email: api-support@acmefin.com
variables:
  baseUrl: https://api.bankofpostman.com/p2p-payments
auth:
  - id: 3c1e9231-fd42-4725-8a27-cd9cb8d1a26d
    type: apikey
    name: apikey auth
    credentials:
      key: Ocp-Apim-Subscription-Key
      value: "{{apiKey}}"
      in: header
