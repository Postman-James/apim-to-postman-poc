$kind: http-request
description: Retrieve the user's P2P payment history including sent and received transfers.
url: "{{baseUrl}}/transfers?page=1&per_page=20&sort_by=string&sort_order=desc&direction=sent&status=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    description: Page number for pagination
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1
          }
        }
      }
  - key: per_page
    value: "20"
    description: Number of results per page (max 100)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
  - key: sort_by
    value: string
    description: Field to sort results by
    $type: string
  - key: sort_order
    value: desc
    description: Sort direction
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "desc",
            "enum": [
              "asc",
              "desc"
            ]
          }
        }
      }
  - key: direction
    value: sent
    description: Filter by sent or received
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "enum": [
              "sent",
              "received"
            ]
          }
        }
      }
  - key: status
    value: string
    description: Filter by status
    $type: string
settings: {}
examples: ./.resources/List P2P transfers.resources/examples
order: 6000
