$kind: http-request
description: Send money to another user by user ID, email, or phone number. Instant transfers use the RTP network or debit card push; standard transfers settle via next-day ACH.
url: "{{baseUrl}}/transfers"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "amount": 1500,
      "currency": "USD",
      "delivery_speed": "standard",
      "funding_source_id": "string",
      "memo": "Dinner last night 🍕",
      "recipient": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "amount": {
          "type": "number",
          "example": 1500,
          "description": "Transaction amount",
          "format": "double"
        },
        "currency": {
          "type": "string",
          "minLength": 3,
          "maxLength": 3,
          "example": "USD",
          "description": "ISO 4217 currency code"
        },
        "delivery_speed": {
          "type": "string",
          "enum": [
            "standard",
            "instant"
          ],
          "description": "Standard (next-day ACH) or instant (RTP/debit push)"
        },
        "funding_source_id": {
          "type": "string",
          "description": "Source account or card to fund the transfer"
        },
        "memo": {
          "type": "string",
          "maxLength": 250,
          "example": "Dinner last night 🍕",
          "description": "Payment note visible to both parties"
        },
        "recipient": {
          "type": "string",
          "description": "Recipient user ID, email, or phone number"
        }
      },
      "required": [
        "recipient",
        "amount",
        "currency"
      ]
    }
settings: {}
examples: ./.resources/Send money.resources/examples
order: 7000
