$kind: http-example
request:
  url: "{{baseUrl}}/transfers/:transfer_id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Ocp-Apim-Subscription-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: transfer_id
      value: string
      description: Unique transfer id
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "amount": 1500,
        "currency": "USD",
        "delivery_speed": "standard",
        "memo": "Dinner last night 🍕",
        "recipient_id": "string",
        "sender_id": "string",
        "status": "pending",
        "transfer_id": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "amount": {
            "type": "number",
            "example": 1500,
            "description": "Transaction amount",
            "format": "double"
          },
          "currency": {
            "type": "string",
            "minLength": 3,
            "maxLength": 3,
            "example": "USD",
            "description": "ISO 4217 currency code"
          },
          "delivery_speed": {
            "type": "string",
            "enum": [
              "standard",
              "instant"
            ],
            "description": "Standard (next-day ACH) or instant (RTP/debit push)"
          },
          "memo": {
            "type": "string",
            "maxLength": 250,
            "example": "Dinner last night 🍕",
            "description": "Payment note visible to both parties"
          },
          "recipient_id": {
            "type": "string",
            "description": "Recipient user ID"
          },
          "sender_id": {
            "type": "string",
            "description": "Sender user ID"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "completed",
              "declined",
              "expired",
              "cancelled"
            ]
          },
          "transfer_id": {
            "type": "string",
            "description": "P2P transfer identifier",
            "format": "uuid"
          }
        },
        "required": [
          "transfer_id"
        ]
      }
order: 1000
