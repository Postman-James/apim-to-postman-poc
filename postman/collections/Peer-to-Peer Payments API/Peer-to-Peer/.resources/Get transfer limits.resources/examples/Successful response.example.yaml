$kind: http-example
request:
  url: "{{baseUrl}}/limits"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Ocp-Apim-Subscription-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "daily_limit": 2500,
        "daily_used": 0,
        "per_transaction_limit": 2500,
        "verification_tier": "basic",
        "weekly_limit": 10000,
        "weekly_used": 0
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "daily_limit": {
            "type": "number",
            "example": 2500,
            "format": "double"
          },
          "daily_used": {
            "type": "number",
            "format": "double"
          },
          "per_transaction_limit": {
            "type": "number",
            "example": 2500,
            "format": "double"
          },
          "verification_tier": {
            "type": "string",
            "enum": [
              "basic",
              "verified",
              "premium"
            ]
          },
          "weekly_limit": {
            "type": "number",
            "example": 10000,
            "format": "double"
          },
          "weekly_used": {
            "type": "number",
            "format": "double"
          }
        },
        "required": [
          "daily_limit",
          "weekly_limit"
        ]
      }
order: 1000
