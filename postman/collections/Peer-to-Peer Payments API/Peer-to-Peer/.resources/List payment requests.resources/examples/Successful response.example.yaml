$kind: http-example
request:
  url: "{{baseUrl}}/requests?page=1&per_page=20&sort_by=string&sort_order=desc&direction=incoming&status=string"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Ocp-Apim-Subscription-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: page
      value: "1"
      description: Page number for pagination
    - key: per_page
      value: "20"
      description: Number of results per page (max 100)
    - key: sort_by
      value: string
      description: Field to sort results by
    - key: sort_order
      value: desc
      description: Sort direction
    - key: direction
      value: incoming
      description: Filter by direction
    - key: status
      value: string
      description: Filter by status
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "amount": 1500,
            "currency": "USD",
            "expires_at": "string",
            "memo": "Dinner last night 🍕",
            "payer_id": "string",
            "request_id": "string",
            "requester_id": "string",
            "status": "pending"
          }
        ],
        "pagination": {
          "page": 1,
          "per_page": 20,
          "total_items": 142,
          "total_pages": 8
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "amount": {
                  "type": "number",
                  "example": 1500,
                  "description": "Transaction amount",
                  "format": "double"
                },
                "currency": {
                  "type": "string",
                  "minLength": 3,
                  "maxLength": 3,
                  "example": "USD",
                  "description": "ISO 4217 currency code"
                },
                "expires_at": {
                  "type": "string",
                  "format": "date-time"
                },
                "memo": {
                  "type": "string",
                  "maxLength": 250,
                  "example": "Dinner last night 🍕",
                  "description": "Payment note visible to both parties"
                },
                "payer_id": {
                  "type": "string"
                },
                "request_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "requester_id": {
                  "type": "string"
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "pending",
                    "paid",
                    "declined",
                    "expired",
                    "cancelled"
                  ]
                }
              },
              "required": [
                "request_id",
                "status"
              ]
            }
          },
          "pagination": {
            "type": "object",
            "description": "Pagination metadata for list responses",
            "properties": {
              "page": {
                "type": "integer",
                "example": 1,
                "description": "Current page number"
              },
              "per_page": {
                "type": "integer",
                "example": 20,
                "description": "Number of items per page"
              },
              "total_items": {
                "type": "integer",
                "example": 142,
                "description": "Total number of items across all pages"
              },
              "total_pages": {
                "type": "integer",
                "example": 8,
                "description": "Total number of pages"
              }
            },
            "required": [
              "page",
              "per_page",
              "total_items",
              "total_pages"
            ]
          }
        },
        "required": [
          "data",
          "pagination"
        ]
      }
order: 1000
