$kind: http-example
request:
  url: "{{baseUrl}}/requests/:request_id/decline"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Ocp-Apim-Subscription-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: request_id
      value: string
      description: Unique request id
  body:
    type: json
    content: |-
      {
        "reason": "string"
      }
response:
  statusCode: 202
  statusText: Accepted
  body:
    type: text
    content: ""
order: 1000
