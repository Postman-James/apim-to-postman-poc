name: API CI

# One job, four labeled steps so you can see each phase, with the Postman CLI
# installed once:  1. Linting -> 2. Smoke tests -> 3. Contract tests -> 4. Update to cloud.
# Gate collections live under tests/ so they don't collide with the native-Git
# resources under postman/ and .postman/.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-pipeline:
    name: API pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: 1. Linting
        # Default fail-severity is ERROR, so governance WARNINGS report without failing.
        # With POSTMAN_API_KEY set, lints against the team's rulesets (OWASP, AI-readiness);
        # without it, falls back to syntax-only so the build still runs.
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          if [ -n "$POSTMAN_API_KEY" ]; then
            echo "Linting against team governance rulesets."
            postman spec lint ./openapi/p2p-payments.yaml --no-report-events
          else
            echo "POSTMAN_API_KEY not set; running syntax-only lint. Add the secret for governance."
            postman spec lint ./openapi/p2p-payments.yaml --no-report-events --issueType=syntax
          fi

      - name: 2. Smoke tests
        run: postman collection run ./tests/collections/smoke-tests.json -e ./tests/environments/dev-mock.postman_environment.json

      - name: 3. Contract tests
        run: postman collection run ./tests/collections/contract-tests.json -e ./tests/environments/dev-mock.postman_environment.json

      - name: 4. Update to cloud
        # Publishes the native-Git resources (postman/ + .postman/resources.yaml) to the
        # cloud workspace. Only on push to main, never on PRs. Skips cleanly without a key
        # or a resources.yaml so the pipeline stays green until it's wired.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          if [ -z "$POSTMAN_API_KEY" ]; then
            echo "POSTMAN_API_KEY not set - skipping cloud publish. Add the secret (private repo) to enable 'postman workspace push'."
            exit 0
          fi
          if [ ! -f .postman/resources.yaml ]; then
            echo "No .postman/resources.yaml - native Git not wired in this repo. Skipping."
            exit 0
          fi
          postman login --with-api-key "$POSTMAN_API_KEY"
          postman workspace push -y
